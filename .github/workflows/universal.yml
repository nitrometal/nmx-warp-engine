name: Generate Universal Pool

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and Maintain Universal Pool
        run: |
          cat << 'EOF' > maintainer.js
          const fs = require('fs');
          const dgram = require('dgram');

          const TARGET_FILE = 'nmx.net.universal.json';
          const DEFAULT_PRIV = 'OI3m2ltSE/bdxGRMvHgO8oN0rpwCR5Wx4nl2XJugTXg=';

          const BASE_SEED_POOL = [
            { country: 'us', endpoint: '146.70.230.146:51820', peer: 'gucaLaM/mgJQbHVvnZNtW+1L4Mi7E2mtTMrhS0K4miU=' },
            { country: 'us', endpoint: '89.187.185.161:51820', peer: 'ZEQHDxg/HbjznRvApyBWFUgS6T20Rvy0/DctZk6FvB4=' },
            { country: 'us', endpoint: '146.70.230.130:51820', peer: 'g0gQj11hsEuYJcjlzVyjq7aQmtC+/ca05vq0qvCQ/zI=' },
            { country: 'us', endpoint: '149.22.84.149:51820', peer: 'tBx0tFy6U050wKXUHW16Ya8gzRVoAGdSZGQ2PokrGA=' },
            { country: 'nl', endpoint: '89.39.107.113:51820', peer: 'UIV6mDfDCun6PrjT7kFrpl02eEwqIa/piXOSKm1ybBU=' },
            { country: 'nl', endpoint: '185.177.124.190:51820', peer: 'jA3Pf5MWPhk8StLXVPyM28av3yAZgw9nEGoIFAyxiiI=' },
            { country: 'nl', endpoint: '149.102.242.94:51820', peer: 'fjmcron5ORLeZigl+fJ00PJGgR/2brhc/HjC5fHSGg4=' },
            { country: 'jp', endpoint: '45.87.213.226:51820', peer: 'BbghXRtbSYBJ2Q/eMu4JV7u8LKiKDfgybk7IJAO7iAU=' },
            { country: 'ch', endpoint: '185.206.224.21:51820', peer: '93rOlHiU4A7ACRTdqButvAjwrccdOgOIHwFMumODvgo=' },
            { country: 'ca', endpoint: '149.88.97.122:51820', peer: 'mS8GfqvUvazXvSYg7VHV7s8eEyU0yyGjJwYgdjHq23A=' }
          ];

          function probeUdp(host, port, timeoutMs = 800) {
            return new Promise((resolve) => {
              const socket = dgram.createSocket('udp4');
              const timer = setTimeout(() => {
                try { socket.close(); } catch (_) {}
                resolve(true);
              }, timeoutMs);

              socket.on('error', () => {
                clearTimeout(timer);
                try { socket.close(); } catch (_) {}
                resolve(false);
              });

              const buf = Buffer.alloc(32);
              socket.send(buf, 0, buf.length, port, host, (err) => {
                if (err) {
                  clearTimeout(timer);
                  try { socket.close(); } catch (_) {}
                  resolve(false);
                }
              });
            });
          }

          async function main() {
            let currentList = [];
            if (fs.existsSync(TARGET_FILE)) {
              try {
                currentList = JSON.parse(fs.readFileSync(TARGET_FILE, 'utf8'));
              } catch (_) {
                currentList = [];
              }
            }

            const rawPool = currentList.length > 0 ? [...currentList, ...BASE_SEED_POOL] : BASE_SEED_POOL;
            const seen = new Set();
            const deduplicated = [];

            for (const item of rawPool) {
              if (!item.endpoint || !item.peer) continue;
              const ep = item.endpoint.trim();
              if (seen.has(ep)) continue;
              seen.add(ep);
              deduplicated.push(item);
            }

            const verifiedList = [];
            for (const node of deduplicated) {
              const parts = node.endpoint.split(':');
              if (parts.length !== 2) continue;
              const host = parts[0].trim();
              const port = parseInt(parts[1].trim(), 10);
              if (isNaN(port)) continue;

              const isReachable = await probeUdp(host, port);
              if (isReachable) {
                verifiedList.push({
                  country: node.country ? node.country.toLowerCase().trim() : 'us',
                  endpoint: node.endpoint.trim(),
                  peer: node.peer.trim(),
                  priv: node.priv ? node.priv.trim() : DEFAULT_PRIV
                });
              }
            }

            const finalList = verifiedList.length > 0 ? verifiedList : BASE_SEED_POOL.map(n => ({ ...n, priv: DEFAULT_PRIV }));
            fs.writeFileSync(TARGET_FILE, JSON.stringify(finalList, null, 2), 'utf8');
          }

          main();
          EOF
          node maintainer.js

      - name: Commit and push verified Universal pool
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add nmx.net.universal.json
          git commit -m "Maintain and verify Universal pool [skip ci]" || exit 0
          git push