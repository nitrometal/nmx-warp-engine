              "endpoint": "149.102.242.94:51820",
              "peer": "fjmcron5ORLeZigl+fJ00PJGgR/2brhc/HjC5fHSGg4=",
              "priv": "OI3m2ltSE/bdxGRMvHgO8oN0rpwCR5Wx4nl2XJugTXg="
            },
            {
              "country": "jp",
              "endpoint": "45.87.213.226:51820",
              "peer": "BbghXRtbSYBJ2Q/eMu4JV7u8LKiKDfgybk7IJAO7iAU=",
              "priv": "OI3m2ltSE/bdxGRMvHgO8oN0rpwCR5Wx4nl2XJugTXg="
            },
            {
              "country": "ch",
              "endpoint": "185.206.224.21:51820",
              "peer": "93rOlHiU4A7ACRTdqButvAjwrccdOgOIHwFMumODvgo=",
