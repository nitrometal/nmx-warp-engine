name: Generate Universal Pool

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq curl dnsutils

      - name: Maintain and populate Universal pool
        env:
          PROTON_KEY: ${{ secrets.PROTON_PRIVATE_KEY }}
        run: |
          cat << 'EOF' > update_pool.sh
          TARGET_FILE="nmx.net.universal.json"
          PRIV_KEY="${PROTON_KEY:-4DNYAYc5s5vVefuTDziBjiZbU8SGc7TKHHxDvpCrIWc=}"

          cat << 'NODES' > proton_seed.json
          [
            {
              "country": "us",
              "endpoint": "89.187.185.161:51820",
              "peer": "ZEQHDxg/HbjznRvApyBWFUgS6T20Rvy0/DctZk6FvB4="
            },
            {
              "country": "us",
              "endpoint": "146.70.230.146:51820",
              "peer": "gucaLaM/mgJQbHVvnZNtW+1L4Mi7E2mtTMrhS0K4miU="
            },
            {
              "country": "us",
              "endpoint": "149.102.242.94:51820",
              "peer": "fjmcron5ORLeZigl+fJ00PJGgR/2brhc/HjC5fHSGg4="
            },
            {
              "country": "us",
              "endpoint": "146.70.230.130:51820",
              "peer": "g0gQj11hsEuYJcjlzVyjq7aQmtC+/ca05vq0qvCQ/zI="
            },
            {
              "country": "us",
              "endpoint": "149.22.84.149:51820",
              "peer": "tBx0tFy6U050wKXUHW16Ya8gzRVoAGdSZGQ2PokrGA="
            },
            {
              "country": "nl",
              "endpoint": "89.39.107.113:51820",
              "peer": "UIV6mDfDCun6PrjT7kFrpl02eEwqIa/piXOSKm1ybBU="
            },
            {
              "country": "nl",
              "endpoint": "185.177.124.190:51820",
              "peer": "jA3Pf5MWPhk8StLXVPyM28av3yAZgw9nEGoIFAyxiiI="
            },
            {
              "country": "nl",
              "endpoint": "149.102.242.94:51820",
              "peer": "fjmcron5ORLeZigl+fJ00PJGgR/2brhc/HjC5fHSGg4="
            },
            {
              "country": "jp",
              "endpoint": "45.87.213.226:51820",
              "peer": "BbghXRtbSYBJ2Q/eMu4JV7u8LKiKDfgybk7IJAO7iAU="
            },
            {
              "country": "ch",
              "endpoint": "185.206.224.21:51820",
              "peer": "93rOlHiU4A7ACRTdqButvAjwrccdOgOIHwFMumODvgo="
            },
            {
              "country": "ca",
              "endpoint": "149.88.97.122:51820",
              "peer": "mS8GfqvUvazXvSYg7VHV7s8eEyU0yyGjJwYgdjHq23A="
            }
          ]
          NODES

          jq --arg pk "$PRIV_KEY" 'map(. + {priv: $pk})' proton_seed.json > "$TARGET_FILE"
          EOF
          bash update_pool.sh

      - name: Commit and push updated Universal pool
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add nmx.net.universal.json
          git diff --staged --quiet || (git commit -m "Automate and maintain Universal pool [skip ci]" && git push)
