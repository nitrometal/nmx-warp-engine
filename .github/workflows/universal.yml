name: Generate Universal Pool

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Maintain and populate Universal pool
        run: |
          cat << 'EOF' > update_pool.sh
          TARGET_FILE="nmx.net.universal.json"

          cat << 'NODES' > default_nodes.json
          [
            {
              "country": "us",
              "endpoint": "146.70.230.146:51820",
              "peer": "gucaLaM/mgJQbHVvnZNtW+1L4Mi7E2mtTMrhS0K4miU=",
              "priv": "OI3m2ltSE/bdxGRMvHgO8oN0rpwCR5Wx4nl2XJugTXg="
            },
            {
              "country": "us",
              "endpoint": "89.187.185.161:51820",
              "peer": "ZEQHDxg/HbjznRvApyBWFUgS6T20Rvy0/DctZk6FvB4=",
              "priv": "OI3m2ltSE/bdxGRMvHgO8oN0rpwCR5Wx4nl2XJugTXg="
            },
            {
              "country": "us",
              "endpoint": "146.70.230.130:51820",
              "peer": "g0gQj11hsEuYJcjlzVyjq7aQmtC+/ca05vq0qvCQ/zI=",
              "priv": "OI3m2ltSE/bdxGRMvHgO8oN0rpwCR5Wx4nl2XJugTXg="
            },
            {
              "country": "us",
              "endpoint": "149.22.84.149:51820",
              "peer": "tBx0tFy6U050wKXUHW16Ya8gzRVoAGdSZGQ2PokrGA=",
              "priv": "OI3m2ltSE/bdxGRMvHgO8oN0rpwCR5Wx4nl2XJugTXg="
            },
            {
              "country": "nl",
              "endpoint": "89.39.107.113:51820",
              "peer": "UIV6mDfDCun6PrjT7kFrpl02eEwqIa/piXOSKm1ybBU=",
              "priv": "OI3m2ltSE/bdxGRMvHgO8oN0rpwCR5Wx4nl2XJugTXg="
            },
            {
              "country": "nl",
              "endpoint": "185.177.124.190:51820",
              "peer": "jA3Pf5MWPhk8StLXVPyM28av3yAZgw9nEGoIFAyxiiI=",
              "priv": "OI3m2ltSE/bdxGRMvHgO8oN0rpwCR5Wx4nl2XJugTXg="
            },
            {
