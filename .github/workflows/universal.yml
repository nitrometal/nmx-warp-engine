              "peer": "mS8GfqvUvazXvSYg7VHV7s8eEyU0yyGjJwYgdjHq23A=",
              "priv": "OI3m2ltSE/bdxGRMvHgO8oN0rpwCR5Wx4nl2XJugTXg="
            }
          ]
          NODES

          if [ ! -f "$TARGET_FILE" ] || [ ! -s "$TARGET_FILE" ] || [ "$(cat "$TARGET_FILE" | tr -d '[:space:]')" = "[]" ]; then
            cp default_nodes.json "$TARGET_FILE"
          else
            jq -s '.[0] + .[1] | unique_by(.endpoint)' "$TARGET_FILE" default_nodes.json > tmp_universal.json
            mv tmp_universal.json "$TARGET_FILE"
          fi
          EOF
          bash update_pool.sh

      - name: Commit and push updated Universal pool
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add nmx.net.universal.json
          git diff --staged --quiet || (git commit -m "Auto-populate Universal pool [skip ci]" && git push)