name: NMX Generate Universal 

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y wireguard-tools jq

    - name: Generate Multi-Country Entries
      run: |
        if [ ! -s nmx.net.universal.json ] || [ "$(cat nmx.net.universal.json)" = "" ]; then
          echo "[]" > nmx.net.universal.json
        fi

        COUNTRIES=("us" "jp" "ch" "nl" "ca")
        TEMP_ARRAY="[]"

        for country in "${COUNTRIES[@]}"; do
          SERVER_PRIV=$(wg genkey)
          CLIENT_PRIV=$(wg genkey)
          SERVER_PUB=$(echo "$SERVER_PRIV" | wg pubkey)

          ENDPOINT="146.70.230.146:51820"

          NEW_ENTRY=$(jq -n \
            --arg co "$country" \
            --arg end "$ENDPOINT" \
            --arg peer "$SERVER_PUB" \
            '{country: $co, endpoint: $end, peer: $peer}')

          TEMP_ARRAY=$(echo "$TEMP_ARRAY" | jq ". += [$NEW_ENTRY]")
        done

        jq ". += $TEMP_ARRAY" nmx.net.universal.json > tmp.json && mv tmp.json nmx.net.universal.json

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add nmx.net.universal.json
        git commit -m "Добавлен новый пак конфигураций (US, JP, CH, NL, CA)"
        git push origin main
