name: NMX Universal Converter

on:
  push:
    paths:
      - 'raw_nmx_server'
      - 'raw_nmx_server.txt'
      - 'raw_nmx_server.conf'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Converter
        run: |
          cat << 'EOF' > converter.js
          const fs = require('fs');

          const TARGET_FILE = 'nmx.net.universal.json';
          const DEFAULT_PRIV = '4DNYAYc5s5vVefuTDziBjiZbU8SGc7TKHHxDvpCrIWc=';

          const allFiles = fs.readdirSync('.');
          console.log('Files in repo root:', allFiles);

          let inputFile = allFiles.find(f => {
            const lower = f.toLowerCase();
            return lower === 'raw_nmx_server' ||
                   lower === 'raw_nmx_server.txt' ||
                   lower === 'raw_nmx_server.conf' ||
                   (lower.includes('raw') && lower.includes('server'));
          });

          if (!inputFile) {
            console.log('Error: raw input file not found');
            process.exit(1);
          }

          console.log('Found input file:', inputFile);
          const rawData = fs.readFileSync(inputFile, 'utf8');

          if (!rawData.trim()) {
            console.log('Input file is empty, nothing to convert');
            process.exit(0);
          }

          let existingNodes = [];
          if (fs.existsSync(TARGET_FILE)) {
            try {
              existingNodes = JSON.parse(fs.readFileSync(TARGET_FILE, 'utf8'));
            } catch (_) {
              existingNodes = [];
            }
          }

          const parsedNodes = [];
          const chunks = rawData.split(/(?=\[Interface\])/i);

          for (const chunk of chunks) {
            if (!chunk.trim()) continue;

            const privMatch = chunk.match(/PrivateKey\s*=\s*([a-zA-Z0-9+/=]+)/i);
            const priv = privMatch ? privMatch[1].trim() : DEFAULT_PRIV;

            const peerBlocks = chunk.split(/(?=\[Peer\])/i);
            for (const pBlock of peerBlocks) {
              const epMatch = pBlock.match(/Endpoint\s*=\s*([0-9a-zA-Z\.\-]+:[0-9]+)/i);
              const pubMatch = pBlock.match(/PublicKey\s*=\s*([a-zA-Z0-9+/=]+)/i);

              if (epMatch && pubMatch) {
                const ep = epMatch[1].trim();
                const pub = pubMatch[1].trim();

                let country = 'us';
                const cMatch = pBlock.match(/#\s*([A-Za-z]{2})-(?:FREE|[0-9]+)/i) ||
                               chunk.match(/#\s*([A-Za-z]{2})-(?:FREE|[0-9]+)/i) ||
                               pBlock.match(/#\s*([A-Za-z]{2})\s*$/m);

                if (cMatch) {
                  country = cMatch[1].toLowerCase().trim();
                } else if (pBlock.toLowerCase().includes('switzerland') || chunk.toLowerCase().includes('ch-')) {
                  country = 'ch';
                } else if (pBlock.toLowerCase().includes('netherlands') || chunk.toLowerCase().includes('nl-')) {
                  country = 'nl';
                } else if (pBlock.toLowerCase().includes('japan') || chunk.toLowerCase().includes('jp-')) {
                  country = 'jp';
                } else if (pBlock.toLowerCase().includes('canada') || chunk.toLowerCase().includes('ca-')) {
                  country = 'ca';
                } else if (pBlock.toLowerCase().includes('poland') || chunk.toLowerCase().includes('pl-')) {
                  country = 'pl';
                } else if (pBlock.toLowerCase().includes('romania') || chunk.toLowerCase().includes('ro-')) {
                  country = 'ro';
                } else if (pBlock.toLowerCase().includes('singapore') || chunk.toLowerCase().includes('sg-')) {
                  country = 'sg';
                }

                parsedNodes.push({
                  country: country,
                  endpoint: ep,
                  peer: pub,
                  priv: priv
                });
              }
            }
          }

          console.log('Successfully parsed nodes from input:', parsedNodes.length);

          const combined = [...parsedNodes, ...existingNodes];
          const seenEndpoints = new Set();
          const uniqueNodes = [];

          for (const node of combined) {
            const ep = node.endpoint.trim();
            if (!seenEndpoints.has(ep)) {
              seenEndpoints.add(ep);
              uniqueNodes.push({
                country: node.country.toLowerCase().trim(),
                endpoint: ep,
                peer: node.peer.trim(),
                priv: node.priv ? node.priv.trim() : DEFAULT_PRIV
              });
            }
          }

          fs.writeFileSync(TARGET_FILE, JSON.stringify(uniqueNodes, null, 2), 'utf8');
          fs.writeFileSync(inputFile, '', 'utf8');
          console.log('Total nodes in database:', uniqueNodes.length);
          console.log('Emptied input file for next batch');
          EOF
          node converter.js

      - name: Commit and push converted pool
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "NMX Action Bot"
          git add nmx.net.universal.json raw_nmx_server raw_nmx_server.txt raw_nmx_server.conf 2>/dev/null || true
          git add -u
          git diff --staged --quiet || (git commit -m "NMX Engine: Ingest and build Universal nodes [skip ci]" && git push)