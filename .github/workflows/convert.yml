name: NMX Universal Converter

on:
  push:
    paths:
      - 'raw_nmx_server'
      - 'raw_nmx_server.txt'
      - 'raw_nmx_server.conf'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Converter
        run: |
          cat << 'EOF' > converter.js
          const fs = require('fs');

          const TARGET_FILE = 'nmx.net.universal.json';
          const DEFAULT_PRIV = '4DNYAYc5s5vVefuTDziBjiZbU8SGc7TKHHxDvpCrIWc=';

          const allFiles = fs.readdirSync('.');

          const inputFiles = allFiles.filter(f => {
            const lower = f.toLowerCase();
            return lower === 'raw_nmx_server' ||
                   lower === 'raw_nmx_server.txt' ||
                   lower === 'raw_nmx_server.conf' ||
                   (lower.includes('raw') && lower.includes('server'));
          });

          if (inputFiles.length === 0) {
            process.exit(0);
          }

          let rawDataCombined = '';
          for (const f of inputFiles) {
            try {
              const content = fs.readFileSync(f, 'utf8');
              if (content.trim()) {
                rawDataCombined += '\n' + content;
              }
            } catch (_) {}
          }

          if (!rawDataCombined.trim()) {
            process.exit(0);
          }

          let existingNodes = [];
          if (fs.existsSync(TARGET_FILE)) {
            try {
              const currentContent = fs.readFileSync(TARGET_FILE, 'utf8');
              existingNodes = JSON.parse(currentContent);
              if (!Array.isArray(existingNodes)) existingNodes = [];
            } catch (_) {
              existingNodes = [];
            }
          }

          function detectCountry(text) {
            const serverMatch = text.match(/Server:\s*([A-Za-z]{2})/i) ||
                                text.match(/#\s*([A-Za-z]{2})-(?:FREE|[0-9]+)/i) ||
                                text.match(/#\s*([A-Za-z]{2})\s*$/m) ||
                                text.match(/#\s*([A-Za-z]{2})[\s\-#_0-9]/i);

            if (serverMatch) {
              return serverMatch[1].toLowerCase().trim();
            }

            const lower = text.toLowerCase();
            if (lower.includes('japan') || lower.includes('jp-') || lower.includes('.jp:')) return 'jp';
            if (lower.includes('mexico') || lower.includes('mx-') || lower.includes('.mx:')) return 'mx';
            if (lower.includes('norway') || lower.includes('no-') || lower.includes('.no:')) return 'no';
            if (lower.includes('netherlands') || lower.includes('nl-') || lower.includes('.nl:')) return 'nl';
            if (lower.includes('switzerland') || lower.includes('ch-') || lower.includes('.ch:')) return 'ch';
            if (lower.includes('poland') || lower.includes('pl-') || lower.includes('.pl:')) return 'pl';
            if (lower.includes('romania') || lower.includes('ro-') || lower.includes('.ro:')) return 'ro';
            if (lower.includes('singapore') || lower.includes('sg-') || lower.includes('.sg:')) return 'sg';
            if (lower.includes('canada') || lower.includes('ca-') || lower.includes('.ca:')) return 'ca';
            if (lower.includes('united states') || lower.includes('usa') || lower.includes('us-') || lower.includes('.us:')) return 'us';
            if (lower.includes('germany') || lower.includes('de-') || lower.includes('.de:')) return 'de';
            if (lower.includes('france') || lower.includes('fr-') || lower.includes('.fr:')) return 'fr';
            if (lower.includes('united kingdom') || lower.includes('gb-') || lower.includes('uk-') || lower.includes('.uk:')) return 'gb';

            return 'us';
          }

          const parsedNodes = [];
          const chunks = rawDataCombined.split(/(?=\[Interface\])/i);

          for (const chunk of chunks) {
            if (!chunk.trim()) continue;

            const privMatch = chunk.match(/PrivateKey\s*=\s*([a-zA-Z0-9+/=]+)/i);
            const priv = privMatch ? privMatch[1].trim() : DEFAULT_PRIV;

            const peerBlocks = chunk.split(/(?=\[Peer\])/i);
            for (const pBlock of peerBlocks) {
              const epMatch = pBlock.match(/Endpoint\s*=\s*([0-9a-zA-Z\.\-]+:[0-9]+)/i);
              const pubMatch = pBlock.match(/PublicKey\s*=\s*([a-zA-Z0-9+/=]+)/i);

              if (epMatch && pubMatch) {
                const ep = epMatch[1].trim();
                const pub = pubMatch[1].trim();
                const country = detectCountry(pBlock + '\n' + chunk);

                parsedNodes.push({
                  country: country,
                  endpoint: ep,
                  peer: pub,
                  priv: priv
                });
              }
            }
          }

          const endpointMap = new Map();

          for (const node of existingNodes) {
            if (node && node.endpoint) {
              const key = node.endpoint.trim().toLowerCase();
              endpointMap.set(key, {
                country: node.country ? node.country.toLowerCase().trim() : 'us',
                endpoint: node.endpoint.trim(),
                peer: node.peer ? node.peer.trim() : '',
                priv: node.priv ? node.priv.trim() : DEFAULT_PRIV
              });
            }
          }

          for (const node of parsedNodes) {
            const key = node.endpoint.trim().toLowerCase();
            endpointMap.set(key, {
              country: node.country.toLowerCase().trim(),
              endpoint: node.endpoint.trim(),
              peer: node.peer.trim(),
              priv: node.priv ? node.priv.trim() : DEFAULT_PRIV
            });
          }

          const finalNodes = Array.from(endpointMap.values());

          fs.writeFileSync(TARGET_FILE, JSON.stringify(finalNodes, null, 2), 'utf8');

          for (const f of inputFiles) {
            try {
              fs.writeFileSync(f, '', 'utf8');
            } catch (_) {}
          }
          EOF
          node converter.js

      - name: Commit and push converted pool
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "NMX Action Bot"
          git add nmx.net.universal.json raw_nmx_server raw_nmx_server.txt raw_nmx_server.conf 2>/dev/null || true
          git add -u
          git diff --staged --quiet || (git commit -m "NMX Engine: Ingest and build Universal nodes [skip ci]" && git push)