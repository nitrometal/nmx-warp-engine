name: NMX Universal Converter

on:
  push:
    paths:
      - 'raw_nmx_server'
      - 'raw_nmx_server.txt'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Converter
        run: |
          cat << 'EOF' > converter.js
          const fs = require('fs');

          const TARGET_FILE = 'nmx.net.universal.json';
          const DEFAULT_PRIV = '4DNYAYc5s5vVefuTDziBjiZbU8SGc7TKHHxDvpCrIWc=';

          let inputFile = null;
          if (fs.existsSync('raw_nmx_server')) {
            inputFile = 'raw_nmx_server';
          } else if (fs.existsSync('raw_nmx_server.txt')) {
            inputFile = 'raw_nmx_server.txt';
          }

          if (!inputFile) {
            process.exit(0);
          }

          const rawData = fs.readFileSync(inputFile, 'utf8');
          if (!rawData.trim()) {
            process.exit(0);
          }

          let existingNodes = [];
          if (fs.existsSync(TARGET_FILE)) {
            try {
              existingNodes = JSON.parse(fs.readFileSync(TARGET_FILE, 'utf8'));
            } catch (_) {
              existingNodes = [];
            }
          }

          const parsedNodes = [];
          const blocks = rawData.split(/\[Interface\]/i).filter(b => b.trim());

          for (const block of blocks) {
            const privMatch = block.match(/PrivateKey\s*=\s*([^\s\r\n]+)/i);
            const pubMatch = block.match(/PublicKey\s*=\s*([^\s\r\n]+)/i);
            const epMatch = block.match(/Endpoint\s*=\s*([0-9a-zA-Z\.\-]+:[0-9]+)/i);

            let priv = DEFAULT_PRIV;
            if (privMatch && privMatch[1]) {
              priv = privMatch[1].trim();
            }

            let country = 'us';
            const countryMatch = block.match(/#\s*([A-Za-z]{2})-(?:FREE|[0-9]+)/i) || block.match(/#\s*([A-Za-z]{2})/i);
            if (countryMatch && countryMatch[1]) {
              country = countryMatch[1].toLowerCase().trim();
            } else if (block.toLowerCase().includes('switzerland') || block.toLowerCase().includes('ch-')) {
              country = 'ch';
            } else if (block.toLowerCase().includes('netherlands') || block.toLowerCase().includes('nl-')) {
              country = 'nl';
            } else if (block.toLowerCase().includes('japan') || block.toLowerCase().includes('jp-')) {
              country = 'jp';
            } else if (block.toLowerCase().includes('canada') || block.toLowerCase().includes('ca-')) {
              country = 'ca';
            } else if (block.toLowerCase().includes('poland') || block.toLowerCase().includes('pl-')) {
              country = 'pl';
            } else if (block.toLowerCase().includes('romania') || block.toLowerCase().includes('ro-')) {
              country = 'ro';
            } else if (block.toLowerCase().includes('singapore') || block.toLowerCase().includes('sg-')) {
              country = 'sg';
            }

            if (epMatch && pubMatch) {
              const ep = epMatch[1].trim();
              const pub = pubMatch[1].trim();
              if (ep.includes(':') && pub.length > 20) {
                parsedNodes.push({
                  country: country,
                  endpoint: ep,
                  peer: pub,
                  priv: priv
                });
              }
            }
          }

          const combined = [...parsedNodes, ...existingNodes];
          const seenEndpoints = new Set();
          const uniqueNodes = [];

          for (const node of combined) {
            const ep = node.endpoint.trim();
            if (!seenEndpoints.has(ep)) {
              seenEndpoints.add(ep);
              uniqueNodes.push({
                country: node.country.toLowerCase().trim(),
                endpoint: ep,
                peer: node.peer.trim(),
                priv: node.priv ? node.priv.trim() : DEFAULT_PRIV
              });
            }
          }

          fs.writeFileSync(TARGET_FILE, JSON.stringify(uniqueNodes, null, 2), 'utf8');
          fs.writeFileSync(inputFile, '', 'utf8');
          EOF
          node converter.js

      - name: Commit and push converted pool
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "NMX Action Bot"
          git add nmx.net.universal.json raw_nmx_server raw_nmx_server.txt 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "NMX Engine: Ingest and build Universal nodes [skip ci]" && git push)