name: Generate AmneziaWG Keys

on:
  workflow_dispatch:

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install WireGuard tools
      run: |
        sudo apt-get update
        sudo apt-get install -y wireguard-tools jq

    - name: Generate Keys and Update JSON
      run: |
        SERVER_PRIV=$(wg genkey)
        CLIENT_PRIV=$(wg genkey)
        SERVER_PUB=$(echo "$SERVER_PRIV" | wg pubkey)
        
        ENDPOINT="127.0.0.1:16666" 

        NEW_ENTRY=$(jq -n \
          --arg co "us" \
          --arg end "$ENDPOINT" \
          --arg peer "$SERVER_PUB" \
          --arg priv "$CLIENT_PRIV" \
          '{country: $co, endpoint: $end, peer: $peer, priv: $priv}')

        jq ". += [$NEW_ENTRY]" nmx.net.universal.json > tmp.json && mv tmp.json nmx.net.universal.json

    - name: Commit and Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add nmx.net.universal.json
        git commit -m "Автоматическое добавление новых ключей AmneziaWG"
        git push
        
